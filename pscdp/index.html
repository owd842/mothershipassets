<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Component Example</title>
  <!-- Import our Web Component JavaScript class -->
  <script type="module" src="user-card.js"></script>
</head>
<body>

  <!-- Define the reusable component template -->
  <template id="user-card-template">
    <style>
      /* :host targets the custom element container itself (<user-card>) */
      :host {
        display: block;
        font-family: Arial, sans-serif;
        background: #f4f4f9;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 15px;
        max-width: 300px;
        margin: 20px auto;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      h3 {
        margin: 0 0 10px 0;
        color: #333;
      }
      p {
        margin: 0;
        color: #666;
      }
      button {
        margin-top: 15px;
        background: #007bef;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
    </style>

    <div class="card-container">
      <h3><slot name="username">Default Name</slot></h3>
      <p><slot name="role">Contributor</slot></p>
      <button id="toggle-btn">Follow</button>
    </div>
  </template>

  <!-- Usage of the custom component -->
  <!-- The content inside the spans will fill the corresponding <slot> positions -->
  <user-card>
    <span slot="username">Jane Doe</span>
    <span slot="role">Lead Software Engineer</span>
  </user-card>

<br/>

  <user-card>
    <span slot="username">John Smith</span>
    <span slot="role">UX Designer</span>
  </user-card>

</body>
</html>
